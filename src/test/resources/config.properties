# Gmail Test Configuration
#
# Credentials are intentionally NOT stored here.
# Supply them via environment variables (recommended) or override this file locally.
#
# Environment variables:
#   GMAIL_USERNAME  - full Gmail address, e.g. testaccount@gmail.com
#   GMAIL_PASSWORD  - application password (Google account -> Security -> App passwords)
#
# Fallback properties (only used when the environment variables are absent):
gmail.username=
gmail.password=

# Browser settings
browser.headless=false
browser.timeout.seconds=30
